apiVersion: v1
kind: Service
metadata:
  name: db # Ini akan jadi HOSTNAME untuk Node.js
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: fantastic-four-service
spec:
  type: LoadBalancer # Atau LoadBalancer jika di Cloud/Docker Desktop
  selector:
    app: fantastic-four # Harus sama dengan label di Deployment Node.js
  ports:
    - protocol: TCP
      port: 80         # Port yang diakses dari luar
      targetPort: 3000 # Port aplikasi di dalam container
