apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fantastic-four-hpa
  namespace: fantastic-four
  labels:
    app: fantastic-four
    monitoring: enabled
    hpa-version: "v2"
  annotations:
    description: "Horizontal Pod Autoscaler for Fantastic Four application"
    monitoring.prometheus.io/scrape: "true"
    monitoring.prometheus.io/path: "/metrics"
    grafana.com/dashboard: "hpa-monitoring"
    runbook-url: "https://github.com/your-org/fantastic-four/wiki/HPA-Runbook"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fantastic-four
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # ==================== RESOURCE METRICS ====================
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    
    # ==================== CUSTOM METRICS (Prometheus) ====================
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: 100
    
    - type: Pods
      pods:
        metric:
          name: http_request_duration_seconds
        target:
          type: AverageValue
          averageValue: 1
    
    # ==================== OBJECT METRICS ====================
    - type: Object
      object:
        metric:
          name: requests_per_second
        describedObject:
          apiVersion: v1
          kind: Service
          name: fantastic-four-service
        target:
          type: Value
          value: 200
    
    - type: Object
      object:
        metric:
          name: error_rate_percentage
        describedObject:
          apiVersion: v1
          kind: Service
          name: fantastic-four-service
        target:
          type: Value
          value: 5  # Max 5% error rate

  # ==================== SCALING BEHAVIOR ====================
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes cooldown for scale down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Max