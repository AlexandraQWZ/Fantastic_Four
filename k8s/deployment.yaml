apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantastic-four
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantastic-four
  template:
    metadata:
      labels:
        app: fantastic-four
    spec:
      containers:
      - name: fantastic-four
        image: alexandraqwz/fantastic_four:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: fantastic-four-service
spec:
  selector:
    app: fantastic-four
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: LoadBalancer